version: 2

project_name: asobi

before:
  hooks:
    - go mod tidy

builds:
  - id: asobi
    main: ./cmd/asobi
    binary: asobi
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X main.version={{ .Version }}
      - -X main.commit={{ .Commit }}
      - -X main.date={{ .Date }}

archives:
  - id: asobi
    name_template: "asobi_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt
  algorithm: sha256

# Sign checksums.txt with the release ed25519 key (ASOBI_SIGNING_KEY secret, a
# PEM private key). `asobi upgrade` verifies checksums.txt.sig against the
# embedded public key, so a GitHub/CDN compromise alone cannot forge an upgrade.
# The raw signature is produced with openssl and read by Go's crypto/ed25519.
signs:
  - id: ed25519
    artifacts: checksum
    signature: "${artifact}.sig"
    cmd: ./scripts/sign-checksums.sh
    args:
      - "${artifact}"
      - "${signature}"

release:
  github:
    owner: widgrensit
    name: asobi-cli

changelog:
  use: github

# Windows package managers. Both publish to separate repos, so they need a PAT
# (repo-scoped GITHUB_TOKEN cannot push cross-repo). Until the tokens are set as
# secrets, skip_upload keeps releases green - binaries still ship, only the
# manifest push is skipped.
scoops:
  - name: asobi
    repository:
      owner: widgrensit
      name: scoop-bucket
      branch: main
      token: '{{ index .Env "SCOOP_TOKEN" }}'
    directory: bucket
    homepage: "https://github.com/widgrensit/asobi"
    description: "Command-line tool for building and deploying multiplayer games on Asobi."
    license: Apache-2.0
    skip_upload: '{{ if ne (index .Env "SCOOP_TOKEN") "" }}false{{ else }}true{{ end }}'

winget:
  - name: asobi
    package_identifier: widgrensit.asobi
    publisher: widgrensit
    short_description: "Command-line tool for building and deploying multiplayer games on Asobi."
    license: Apache-2.0
    homepage: "https://github.com/widgrensit/asobi"
    publisher_url: https://github.com/widgrensit
    publisher_support_url: "https://github.com/widgrensit/asobi-cli/issues"
    license_url: "https://github.com/widgrensit/asobi-cli/blob/main/LICENSE"
    skip_upload: '{{ if ne (index .Env "WINGET_TOKEN") "" }}false{{ else }}true{{ end }}'
    repository:
      owner: widgrensit
      name: winget-pkgs
      branch: "asobi-{{ .Version }}"
      token: '{{ index .Env "WINGET_TOKEN" }}'
      pull_request:
        enabled: true
        draft: false
        base:
          owner: microsoft
          name: winget-pkgs
          branch: master
